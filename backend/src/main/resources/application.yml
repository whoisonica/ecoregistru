server:
  port: ${PORT:8080}

spring:
  application:
    name: ecoregistru
  datasource:
    # JDBC_DATABASE_* comes first because Heroku's Java buildpack derives it from the
    # Postgres add-on in real JDBC form. The add-on's own DATABASE_URL is
    # postgres://user:pass@host/db, which the driver cannot parse.
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/ecoregistru}}
    driver-class-name: org.postgresql.Driver
    username: ${JDBC_DATABASE_USERNAME:${DATABASE_USERNAME:eco}}
    password: ${JDBC_DATABASE_PASSWORD:${DATABASE_PASSWORD:eco}}
  jpa:
    hibernate:
      # Schema is owned by Flyway. NEVER 'update' (quality bar).
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # Plasa de sub verificarea din `WasteMovementService`, nu pragul produsului. Pragul e 10 MB
      # — limita contului Cloudinary — iar aici stă puțin deasupra lui, ca fișierul să apuce să
      # ajungă la verificarea noastră și să primească mesajul cu cifra, în loc să fie oprit aici
      # cu o eroare generică. Era 25MB, adică de două ori și jumătate peste zidul adevărat.
      max-file-size: 12MB
      max-request-size: 12MB
  mail:
    protocol: smtp
    port: ${MAIL_PORT:587}
    host: ${MAIL_HOST:smtp.zoho.eu}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            # JavaMail reads 'enable', not 'enabled', and it has to sit under smtp — the old
            # spelling produced mail.starttls.enabled, a property nothing reads, so port 587
            # stayed in the clear and every provider refused to authenticate on it.
            enable: true
            # Fail loudly if the server will not upgrade, instead of falling back to plaintext
            # and sending a password over an open connection.
            required: true
          # A hung SMTP connection otherwise holds a request thread until the socket gives up,
          # well past Heroku's 30s router timeout. An invite is worth 10 seconds, not a worker.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  # Parola conturilor demo (profilul `dev`). Goală dinadins: nicio parolă nu se commite, fiindcă
  # repo-ul e public. Nesetată, `DevDataSeeder` generează una la fiecare pornire și o scrie în log;
  # suita de interfață o primește prin `DEMO_PASSWORD`, aceeași valoare în amândouă terminalele.
  demo-password: ${DEMO_PASSWORD:}
  # Base URL used in email links (verification, reset).
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    # Originile de pe care browserul are voie să ceară. Implicit: exact frontendul nostru, deci
    # producția nu are nevoie de o variabilă nouă — `FRONTEND_BASE_URL` e deja setată acolo.
    # `CORS_ALLOWED_ORIGINS` acceptă o listă separată prin virgulă, pentru cazul în care apare un
    # al doilea client (domeniu propriu, aplicație mobilă). Vezi `CorsConfig`.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_BASE_URL:http://localhost:5173}}
  mail:
    from: ${MAIL_FROM:contact@ecoregistru.ro}
  jwt:
    # Base64-encoded HMAC secret. MUST be set in every environment.
    secret: ${JWT_SECRET:}
  cloudinary:
    # Single URL form: cloudinary://<api_key>:<api_secret>@<cloud_name>
    url: ${CLOUDINARY_URL:}
    folder: ${CLOUDINARY_FOLDER:ecoregistru}

sentry:
  # P0.6 — colectorul de erori. **Gol implicit**: fără DSN, SDK-ul nu trimite nimic și nu pornește
  # nimic, deci dev-ul, testele și un deploy fără variabilă se comportă exact ca înainte. Se aprinde
  # cu `heroku config:set SENTRY_DSN=... -a ecoregistru-api`.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:productie}
  # Numai erori, nu și urme de performanță: ce lipsea era „aflu că s-a rupt ceva", nu profiling —
  # iar tracing-ul pe planul gratuit se consumă în câteva zile și lasă erorile pe dinafară.
  traces-sample-rate: 0
  # Corpul cererii și antetele NU se trimit. Aplicația e multi-tenant și duce date de client:
  # un raport de eroare cu un formular de mișcare în el ar scoate din firmă exact ce apărăm.
  send-default-pii: false
  # Ordinea cea mai joasă = rezolvatorul automat al lui Sentry nu apucă nimic. Dinadins: el ar
  # raporta **fiecare** excepție care iese dintr-un controller, iar aici ies și cele normale —
  # `NotFoundException`, `BusinessException`, validarea unui formular. Într-o săptămână, cele 400-uri
  # ale unui client care greșește un CUI ar îneca singurul lucru pentru care există colectorul.
  # Raportarea se face pe o linie, din `AdviceController.handleUnexpected`, adică exact de pe
  # ramura care înseamnă „nu ne așteptam la asta": 500-urile.
  exception-resolver-order: 2147483647

management:
  health:
    mail:
      # Indicatorul de mail deschide o conexiune SMTP **reală** la fiecare cerere pe
      # /actuator/health. Cu MAIL_USERNAME/PASSWORD nesetate (cazul obişnuit în dev) el aruncă
      # `AuthenticationFailedException`, deci health-ul întorcea `DOWN` pe o aplicaţie perfect
      # sănătoasă — iar README-ul îl dă drept locul unde se verifică dacă merge.
      #
      # În producţie era mai rău decât zgomot: fiecare sondă deschidea un SMTP cu timeout-urile de
      # 10s de mai sus, iar o indisponibilitate la furnizorul de mail ar fi raportat toată
      # aplicaţia ca fiind căzută. Mailul e o funcţie a ei (invitaţii, alerte), nu condiţia ca ea
      # să răspundă la cereri; când chiar nu merge, se vede în `EmailService`, cu eroarea lui.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ro.ecoregistru: INFO
