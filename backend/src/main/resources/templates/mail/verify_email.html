<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
<div style="max-width: 520px; margin: 0 auto; padding: 24px;">
    <h2 style="color: #047857;">Bun venit la EcoRegistru</h2>
    <p>Salut<span th:if="${firstName != ''}" th:text="' ' + ${firstName}"></span>,</p>
    <p>Îți mulțumim pentru înregistrare. Confirmă-ți adresa de email apăsând butonul de mai jos:</p>
    <p style="text-align: center; margin: 32px 0;">
        <a th:href="${verifyUrl}"
           style="background: #047857; color: #ffffff; padding: 12px 24px; border-radius: 6px; text-decoration: none;">
            Confirmă emailul
        </a>
    </p>
    <p style="font-size: 13px; color: #6b7280;">
        Dacă butonul nu funcționează, copiază acest link în browser:<br/>
        <a th:href="${verifyUrl}" th:text="${verifyUrl}" style="color: #047857;"></a>
    </p>
    <p style="font-size: 13px; color: #6b7280;">Linkul este valabil 30 de minute.</p>
    <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;"/>
    <p style="font-size: 12px; color: #9ca3af;">EcoRegistru — evidența și raportarea gestiunii deșeurilor.</p>
</div>
</body>
</html>
