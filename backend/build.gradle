plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.1'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'ro.ecoregistru'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Core Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Migrations (Flyway managed by Spring Boot 3.2 -> Flyway 9.x). ddl-auto is OFF.
	implementation 'org.flywaydb:flyway-core'

	// JWT auth
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// DTO mapping
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'

	// OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// File storage: Cloudinary (decision 2026-07-11)
	implementation 'com.cloudinary:cloudinary-http5:2.3.0'

	// Evidence exports (used from Phase B1): Excel + PDF
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'com.github.librepdf:openpdf:1.3.35'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// Real embedded Postgres for integration tests (no Docker needed).
	testImplementation 'io.zonky.test:embedded-database-spring-test:2.5.1'
	testImplementation 'io.zonky.test:embedded-postgres:2.0.7'
	testImplementation 'io.zonky.test.postgres:embedded-postgres-binaries-windows-amd64:15.6.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Single deployable: bootJar is the runnable artifact served on Heroku.
bootJar {
	archiveClassifier.set('boot')
}

jar {
	archiveClassifier.set('')
	manifest {
		attributes('Main-Class': 'ro.ecoregistru.EcoRegistruApplication')
	}
}

// Heroku's Gradle buildpack invokes `./gradlew stage`. Depend on bootJar rather
// than build: the integration tests pull embedded-postgres-binaries-windows-amd64,
// which cannot run on a Linux dyno, so `build` would fail during the slug compile.
tasks.register('stage') {
	dependsOn 'bootJar'
}
