plugins {
	id 'java'
	// „1060 de teste" spune câte rulează, nu ce **nu** e atins: golurile BUG-045…047 le-a găsit o
	// citire de cod, nu suita. Raportul se generează la fiecare `test` şi se citeşte din
	// `build/reports/jacoco/test/html/index.html`; fără prag, dinadins — un procent impus pe tot
	// repo-ul se satisface cu teste care nu verifică nimic.
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ro.ecoregistru'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext['flyway.version'] = '11.20.3'

dependencies {
	// Core Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Migrations. ddl-auto is OFF. Boot 3.5 manages Flyway 11.7, which predates PostgreSQL 18 (Heroku runs 18.3) and
	// logged „Flyway upgrade recommended” on every start; `flyway.version` below lifts it to the last 11.x. Since
	// Flyway 10 the PostgreSQL support is its own module — without it the dyno refuses to start.
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// JWT auth
	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.7'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.7'

	// OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	// File storage: Cloudinary (decision 2026-07-11)
	implementation 'com.cloudinary:cloudinary-http5:2.3.0'

	// P0.6 — colector de erori. Fără `SENTRY_DSN` starterul nu trimite nimic și nu pornește nimic,
	// deci dev-ul și testele rulează exact ca înainte; se aprinde punând variabila pe dyno.
	implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.14.0'

	// Rate limiting (P0.3): in-memory token buckets, one dyno, no Redis.
	implementation 'com.bucket4j:bucket4j-core:8.10.1'

	// Evidence exports (used from Phase B1): Excel + PDF
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'com.github.librepdf:openpdf:3.0.5'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	// MapStruct a plecat pe 20.09.2026: era declarat din şablonul de la care a pornit proiectul, dar
	// nu-l folosea nimeni — singurul mapper, `mapper/WasteMovementMapper`, e scris de mână ca
	// `@Component`. Un procesor de adnotări care nu procesează nimic tot se descarcă şi tot rulează
	// la fiecare compilare.

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// Real embedded Postgres for integration tests (no Docker needed).
	testImplementation 'io.zonky.test:embedded-database-spring-test:2.8.0'
	testImplementation 'io.zonky.test:embedded-postgres:2.0.7'
	// Embedded Postgres binaries, one per platform the suite is ever run on. Only the Windows
	// classifier used to be declared, and the reading of that was wrong in both directions: the
	// other platforms DO arrive, transitively, so a Linux runner would have started — but at
	// **14.10.1**, while Windows ran 15.6.0. The suite would have been green against one major
	// version on CI and another on the machine that wrote the code, which is the kind of difference
	// that shows up as one failing migration, once, in the worst week. Pinned to the same version
	// everywhere; darwin-arm64v8 is here so an Apple Silicon machine stops going through Rosetta.
	testImplementation 'io.zonky.test.postgres:embedded-postgres-binaries-linux-amd64:15.6.0'
	testImplementation 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-amd64:15.6.0'
	testImplementation 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8:15.6.0'
	testImplementation 'io.zonky.test.postgres:embedded-postgres-binaries-windows-amd64:15.6.0'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

// Single deployable: bootJar is the runnable artifact served on Heroku.
bootJar {
	archiveClassifier.set('boot')
}

jar {
	archiveClassifier.set('')
	manifest {
		attributes('Main-Class': 'ro.ecoregistru.EcoRegistruApplication')
	}
}

// Heroku's Gradle buildpack invokes `./gradlew stage`. Depend on bootJar rather than build: the
// integration tests would start an embedded Postgres inside the slug compile, adding minutes to
// every deploy for a verdict that belongs earlier. Since 09.09.2026 that verdict has a place:
// .github/workflows/ci.yml runs the suite on every push, so the dyno build does not need to.
tasks.register('stage') {
	dependsOn 'bootJar'
}
