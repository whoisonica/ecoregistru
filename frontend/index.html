<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Faviconul e iconița eco360 (pătratul rotunjit, `eco360-logo/final/svg/eco360-iconita.svg`). Fără el browserul
         cere `/favicon.ico`, pe care aplicația nu-l servește: 404 în consolă la fiecare vizită și proba 6 roșie.
         Până la 14.10.2026 stătea aici inline, ca `data:` URI (semnul vechi, bucla-casă); logoul nou are literele în
         contururi și e prea lung pentru un atribut, deci vine din `public/brand/`, ca iconița de telefon. -->
    <link rel="icon" type="image/svg+xml" href="/brand/eco360-iconita.svg" />
    <!-- Iconița de pe ecranul principal al telefonului (iOS nu citește SVG-ul de mai sus). -->
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>eco360</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
