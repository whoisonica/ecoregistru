<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon inline, ca `data:` URI: browserul cere `/favicon.ico` la prima încărcare a
         oricărei pagini, iar aplicația nu servea nimic acolo — deci 404 în consolă la fiecare
         vizită, tab gol pentru prospectul care deschide `/cerere-cont`, şi proba 6 roşie pe
         eroarea aia (singura navigare care începe pe altă pagină decât `/login`).
         Inline, fiindcă un `.ico` ar fi primul fişier binar din repo şi Vite îl serveşte oricum
         din `public/` doar cu un director în plus. SVG-ul e bucla-casă a mărcii WasteHouse, aceeași ca pe wastehouse.ro. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23047857'/%3E%3Cpath d='M11.5 23.5H7V13L16 5l9 8v10.5h-7.5M21 20l-3.5 3.5L21 27' stroke='%23ffffff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- Iconița de pe ecranul principal al telefonului (iOS nu citește SVG-ul de mai sus). -->
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>WasteHouse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
