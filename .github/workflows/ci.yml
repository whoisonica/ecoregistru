# P0.7 — rulează plasa de siguranță pe care o avem deja.
#
# Suita de backend și probele de ecran existau de mult, dar până azi nimic nu le pornea la push: tot
# ce ținea proiectul întreg era disciplina de a le rula cu mâna. La a treia felie livrată în grabă,
# regresia o găsește clientul. (Fără cifre aici dinadins: se citesc din
# `backend/build/test-results/test/*.xml` și din `frontend/e2e/run.mjs`, și îmbătrâneau într-o lună.)
#
# Suita e2e (`npm run e2e`) are job propriu din 16.09.2026: până atunci cerea o bază „acumulată” din
# rulări anterioare (a doua firmă, termene depășite) și nu putea porni pe una nouă. `DevDataSeeder`
# le pune acum singur, deci jobul pornește de la zero: Postgres ca serviciu, backendul pe profilul
# dev, Vite, apoi Chrome-ul runnerului.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Un push nou peste altul încă în lucru îl anulează pe cel vechi: interesează verdictul pe ultimul
# commit, nu pe fiecare din drum.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — ./gradlew test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      # Gradle 8.5 din wrapper; cache-ul e al acțiunii, nu al nostru de întreținut.
      - uses: gradle/actions/setup-gradle@v6

      # Postgres-ul e **embedded** (zonky), deci nu e nevoie de niciun serviciu pornit aici.
      # Binarele sunt fixate în `build.gradle` pe fiecare platformă, la aceeași versiune —
      # `linux-amd64:15.6.0` e cel pe care îl folosește runnerul ăsta.
      - name: ./gradlew test
        working-directory: backend
        run: ./gradlew test --no-daemon --console=plain

      # Raportul HTML al testelor, ca un eșec să nu se citească din log.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: raport-teste-backend
          path: backend/build/reports/tests/test/
          retention-days: 7

  frontend:
    name: frontend — tsc + eslint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # Cele două verificări din `prompt-continuare.md`, în ordinea de acolo. `tsc --noEmit` nu vede
      # dacă un buton se poate apăsa — de-asta există suita e2e — dar prinde tot ce ține de tipuri.
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit

      # Ce nu poate spune `tsc`: dependenţele unui hook şi accesibilitatea (20.09.2026). Regulile şi
      # motivul fiecărei scutiri sunt în `frontend/eslint.config.js`. Avertismentele nu opresc CI —
      # erorile da.
      - name: eslint
        working-directory: frontend
        run: npx eslint src

      - name: vite build
        working-directory: frontend
        run: npm run build

      # Regulile pure din `src/lib` și `components/movements/movementRules.ts`, cu `node --test`.
      - name: npm test
        working-directory: frontend
        run: npm test

  e2e:
    name: e2e — Chrome peste backend + frontend pe o bază nouă
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eco
          POSTGRES_PASSWORD: eco
          POSTGRES_DB: ecoregistru
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eco" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Parolă de unică folosință: baza moare odată cu jobul, deci nu e o credențială.
      DEMO_PASSWORD: ci-e2e-${{ github.run_id }}
      E2E_PASSWORD: ci-e2e-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: backend (profilul dev, seed demo)
        working-directory: backend
        run: |
          SPRING_PROFILES_ACTIVE=dev nohup ./gradlew bootRun --no-daemon --console=plain > ../backend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 2
          done
          tail -80 ../backend.log; exit 1

      - name: frontend (Vite)
        working-directory: frontend
        run: |
          nohup npx vite --port 5173 --strictPort > ../vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 1
          done
          cat ../vite.log; exit 1

      # Chrome-ul e preinstalat pe ubuntu-latest, deci `E2E_CHANNEL=chrome` (implicitul) merge.
      - name: npm run e2e
        working-directory: frontend
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-capturi-si-loguri
          path: |
            frontend/e2e/shots/
            backend.log
            vite.log
          retention-days: 7
