# P0.7 — rulează plasa de siguranță pe care o avem deja.
#
# 260 de teste de backend și 273 de verificări de interfață, și până azi nimic nu le pornea la push:
# tot ce ținea proiectul întreg era disciplina de a le rula cu mâna. La a treia felie livrată în
# grabă, regresia o găsește clientul.
#
# Ce **nu** e aici, dinadins: suita e2e (`npm run e2e`). Ea conduce un Chrome adevărat peste un
# backend și un frontend pornite, ~7 minute, și cere `E2E_PASSWORD` plus o bază Postgres — deci ar
# fi al doilea fel de job, cu alt fel de fragilitate. Rămâne comanda care se rulează cu mâna
# înainte de deploy, așa cum e scrisă în `prompt-continuare.md`.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Un push nou peste altul încă în lucru îl anulează pe cel vechi: interesează verdictul pe ultimul
# commit, nu pe fiecare din drum.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — 260 de teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      # Gradle 8.5 din wrapper; cache-ul e al acțiunii, nu al nostru de întreținut.
      - uses: gradle/actions/setup-gradle@v4

      # Postgres-ul e **embedded** (zonky), deci nu e nevoie de niciun serviciu pornit aici.
      # Binarele sunt fixate în `build.gradle` pe fiecare platformă, la aceeași versiune —
      # `linux-amd64:15.6.0` e cel pe care îl folosește runnerul ăsta.
      - name: ./gradlew test
        working-directory: backend
        run: ./gradlew test --no-daemon --console=plain

      # Raportul HTML al testelor, ca un eșec să nu se citească din log.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: raport-teste-backend
          path: backend/build/reports/tests/test/
          retention-days: 7

  frontend:
    name: frontend — tsc + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # Cele două verificări din `prompt-continuare.md`, în ordinea de acolo. `tsc --noEmit` nu vede
      # dacă un buton se poate apăsa — de-asta există suita e2e — dar prinde tot ce ține de tipuri.
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit

      - name: vite build
        working-directory: frontend
        run: npm run build
