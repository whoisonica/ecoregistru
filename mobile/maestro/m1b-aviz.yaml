# M1b: avizul din galerie → câmpurile citite → confirmate unul câte unul → predarea salvată.
#   maestro test -e PASSWORD=<ceva> -e METRO=http%3A%2F%2Flocalhost%3A8081 --test-output-dir <folder> maestro/m1b-aviz.yaml
# Avizul e INVENTAT (`fixtures/aviz-partener.png`, randat din HTML: Demo Reciclare SRL → Eco Valorificare SA, 15 01 02,
# 1.250 kg, seria DRS nr. 000417) și pus în galerie CHIAR ÎNAINTE de rulare (fluxul alege cea mai nouă poză): `xcrun simctl addmedia booted …` pe iOS,
# `adb push … /sdcard/Pictures/` + scanarea media pe Android. Simulatorul n-are cameră, deci poza vine din galerie;
# restul drumului e același.
# Din 27.09.2026 (F4) formularul e pe trei pași: „Continuă” (`step-next`) nu trece peste o rubrică citită din poză
# neconfirmată sau peste o eroare de pe pasul curent; „Salvează predarea” (`handover-save`) e pe pasul 3.
appId: ro.wastehouse.app
---
- runFlow: pornire.yaml
- runFlow: login.yaml

- tapOn:
    id: tab-adauga
- extendedWaitUntil:
    visible:
      id: pick-aviz
    timeout: 20000
- takeScreenshot: 01-adauga
- tapOn:
    id: pick-aviz

# Selectorul de poze al sistemului: cea mai nouă poză e prima (stânga sus pe iOS) — `aviz-partener`, pus chiar înainte.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: Photos
          timeout: 15000
      # Grila se încarcă după titlu; un tap prea devreme cade pe gol (27.09.2026, cu multe poze în galerie).
      - waitForAnimationToEnd
      - tapOn:
          point: "17%,24%"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*[Pp]hoto.*"
          timeout: 15000
      - tapOn:
          text: "Photo taken on.*"
          index: 0

# --- Pasul 1: fiecare câmp citit are rândul lui de pe aviz și butonul „Corect”. ---
- extendedWaitUntil:
    visible:
      id: f-date-confirm
    timeout: 30000
- takeScreenshot: 02-citit
- assertVisible: '.*Seria DRS Nr. 000417.*'

# Punctul de lucru întâi (firma demo are trei); apoi „Continuă” nu pleacă până nu sunt confirmate cele citite
# de pe pasul ăsta: rămâne și spune câte mai sunt.
- scrollUntilVisible:
    element: Punct de lucru Cluj
    direction: UP
- tapOn: Punct de lucru Cluj
- scrollUntilVisible:
    element:
      id: step-next
- tapOn:
    id: step-next
- assertVisible: "3 rubrici citite din poză, de confirmat"
- assertVisible: Ce și cât
- takeScreenshot: 03-neconfirmat

# Confirmarea, de sus în jos. Fără centrare, „Corect” ajunge sus, sub rotița plutitoare a clientului de dezvoltare
# (dreapta sus), și apăsarea deschide meniul lui în loc să confirme data. O aplicație de magazin n-are rotița.
- scrollUntilVisible:
    element:
      id: f-date-confirm
    direction: UP
    centerElement: true
- tapOn:
    id: f-date-confirm
# Confirmarea scoate rândul „Din poză” de sub dată, deci cardul codului urcă: se așteaptă și se centrează din nou.
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: f-code-confirm
    centerElement: true
- tapOn:
    id: f-code-confirm
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: f-qty-confirm
    centerElement: true
- tapOn:
    id: f-qty-confirm
- tapOn:
    id: step-next

# --- Pasul 2: destinatarul citit din poză, soarta și codul R/D. ---
- extendedWaitUntil:
    visible: Cui și cum
    timeout: 5000
- scrollUntilVisible:
    element:
      id: f-partner-confirm
    centerElement: true
- tapOn:
    id: f-partner-confirm
- assertNotVisible: "Confirmă .* citit.* din poză."
# G3: fără soartă și cod R/D nu se trece mai departe.
- scrollUntilVisible:
    element:
      id: step-next
- tapOn:
    id: step-next
- assertVisible: Cui și cum
- scrollUntilVisible:
    element: "Câmp obligatoriu."
    direction: UP
- takeScreenshot: 04-cod-cerut

# „La fel ca data trecută” e primul card: ultima predare de 15 01 02 către Eco Valorificare (seed-ul: R3, solid,
# RP, AN, Vr), aplicată numai la apăsare — cu tot ce pune și webul — și sare la pasul 3.
- scrollUntilVisible:
    element:
      id: same-as-last
    direction: UP
    centerElement: true
- assertVisible: "R3 către Eco Valorificare SA"
- tapOn:
    id: same-as-last

# --- Pasul 3: rubricile de pe fișă vin pliate, cu rezumatul pe rând (rândul e un singur nod: eticheta + rezumatul). ---
- extendedWaitUntil:
    visible: Pe fișă și transport
    timeout: 5000
- assertVisible: ".*Solid.*"
- assertVisible: ".*AN — Auto nespecial.*"
- assertVisible: "Completate din ultima predare. Apasă pe un rând ca să schimbi."
- takeScreenshot: 05-la-fel
# Soarta e valorificare, deci destinațiile oferite sunt numai din tabăra ei: Vr, P, Ve, A.
- tapOn:
    id: fold-wasteDestination
- assertVisible:
    id: dest-Vr
- assertNotVisible:
    id: dest-DO
- tapOn:
    id: fold-wasteDestination
# 15 01 02 își spune singur materialul, deci nu se cere.
- scrollUntilVisible:
    element: ".*Alte plastice \\(propus din cod\\).*"
# Documentul și mașina vin din poză: se confirmă și ele.
- scrollUntilVisible:
    element:
      id: f-doc-confirm
    centerElement: true
- tapOn:
    id: f-doc-confirm
- scrollUntilVisible:
    element:
      id: f-vehicle-confirm
    direction: UP
    centerElement: true
- tapOn:
    id: f-vehicle-confirm
- assertVisible: "Intră în registru acum, cu poza"
- takeScreenshot: 06-inainte-de-salvare
- tapOn:
    id: handover-save

# --- Bonul (din 27.09.2026): predarea a ajuns în registru, apoi „Gata” duce înapoi pe „Adaugă”. ---
# Pe backendul local fără Cloudinary poza cade și se reîncearcă: bonul spune și asta (`gata-photoFailed`).
- extendedWaitUntil:
    visible:
      id: "gata-(sent|photoFailed)"
    timeout: 20000
- assertVisible: Predarea e în registru
- takeScreenshot: 07-bon
- scrollUntilVisible:
    element:
      id: gata-done
- tapOn:
    id: gata-done
- extendedWaitUntil:
    visible:
      id: pick-aviz
    timeout: 15000
# Predarea a plecat: nicio ciornă de reluat.
- assertNotVisible:
    id: draft-card
- takeScreenshot: 08-dupa-salvare
