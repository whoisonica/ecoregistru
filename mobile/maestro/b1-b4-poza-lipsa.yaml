# B1 + B4 (28.09.2026): poza unei predări din coadă a dispărut de pe telefon. Rândul nu mai stă „de trimis” la nesfârșit:
# devine „refuzat”, cu predarea în registru, iar „Scoate” cere confirmare.
# Pregătirea: `m1b-aviz.yaml` pe backendul local fără Cloudinary (poza primește 500 și rămâne în coadă), apoi poza ștearsă din
# containerul aplicației: `rm "$(xcrun simctl get_app_container booted ro.wastehouse.app data)"/Documents/outbox/*.jpg`.
# Fără pornire: aplicația rămâne unde a lăsat-o `m1b-aviz` (pe „Adaugă”, cu rândul în coadă).
#   maestro test --test-output-dir <folder> maestro/b1-b4-poza-lipsa.yaml
appId: ro.wastehouse.app
---
- extendedWaitUntil:
    visible:
      id: outbox-send
    timeout: 15000
- tapOn:
    id: outbox-send
# B1: rândul e refuzat, cu predarea în registru și motivul.
- extendedWaitUntil:
    visible: ".*Poza nu mai e pe telefon.*"
    timeout: 45000
- assertVisible: ".*Predarea e în registru; poza n-a urcat.*"
- assertVisible: refuzată
- assertNotVisible:
    id: outbox-send
- takeScreenshot: 01-refuzat-poza-lipsa
# B4: „Scoate” nu mai șterge dintr-o atingere.
- tapOn:
    id: outbox-remove
- extendedWaitUntil:
    visible: Scoți predarea din telefon?
    timeout: 5000
- assertVisible: Predarea rămâne în registru; numai poza nu mai urcă.
- takeScreenshot: 02-confirmare
- tapOn: Renunță
- assertVisible:
    id: outbox-row
- tapOn:
    id: outbox-remove
- extendedWaitUntil:
    visible: Scoți predarea din telefon?
    timeout: 5000
# „Scoate” din dialog și legătura de pe rând, rămasă sub dialog, au același text; legătura cade chiar în colțul
# butonului, deci nici `index` nu le desparte. Se apasă mijlocul butonului din dialog (iPhone 17).
- tapOn:
    point: "68%,57%"
- extendedWaitUntil:
    notVisible:
      id: outbox-row
    timeout: 5000
- takeScreenshot: 03-scos
