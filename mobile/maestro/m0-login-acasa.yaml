# M0: login cu contul demo pe backendul local și Acasă cu cifra lunii.
# Parola nu stă aici (README-ul backendului, DEMO_PASSWORD):  maestro test -e PASSWORD=<ceva> -e METRO=http%3A%2F%2Flocalhost%3A8081 --test-output-dir <folder> maestro/m0-login-acasa.yaml
# Pe Android întâi `adb reverse tcp:8081 tcp:8081`, ca emulatorul să vadă Metro la localhost.
appId: ro.wastehouse.app
---
- launchApp:
    clearState: true
    clearKeychain: true
# Development build: aplicația se leagă de Metro prin linkul clientului de dezvoltare.
- openLink: exp+wastehouse://expo-development-client/?url=${METRO}
# Pe Android lansatorul clientului de dezvoltare nu ia linkul la prima pornire: adresa se scrie de mână.
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - tapOn:
          text: Cancel
          optional: true
      - tapOn: "http://"
      - inputText: localhost:8081
      - tapOn: Connect
# Meniul clientului de dezvoltare se deschide singur la prima pornire și acoperă formularul.
- extendedWaitUntil:
    visible: "Runtime version.*|Autentificare"
    timeout: 60000
- tapOn:
    text: Continue
    optional: true
- extendedWaitUntil:
    visible: Reload
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: Reload
      platform: Android
    commands:
      - back
- runFlow:
    when:
      visible: Reload
      platform: iOS
    commands:
      - tapOn:
          point: "90%,48%"
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 20000
- takeScreenshot: 01-login
- tapOn:
    id: login-email
- inputText: admin@demo.ro
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: login-submit
# iOS întreabă dacă salvează parola în Keychain-ul simulatorului.
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible: .*ÎNREGISTRAT.*
    timeout: 20000
- takeScreenshot: 02-acasa-luna-curenta
- tapOn: Luna anterioară
- tapOn: Luna anterioară
- extendedWaitUntil:
    visible: 7 mișcări în lună
    timeout: 10000
- assertVisible: "790,5"
- takeScreenshot: 03-acasa-iulie
